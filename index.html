<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Planeten</title>
</head>
<body>
<!-- Navigation Menu -->
<nav class="main-navigation">
<div class="nav-items">
<a href="#hero-section" class="nav-item active" data-section="hero">
<div class="nav-icon">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
</svg>
</div>
<span class="nav-label">Intro</span>
</a>
<a href="#carousel-section" class="nav-item" data-section="carousel">
<div class="nav-icon">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="10"/>
<circle cx="12" cy="12" r="3"/>
</svg>
</div>
<span class="nav-label">Planets</span>
</a>
<a href="#asteroid-section" class="nav-item" data-section="asteroid">
<div class="nav-icon">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
<polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
<line x1="12" y1="22.08" x2="12" y2="12"/>
</svg>
</div>
<span class="nav-label">Asteroids</span>
</a>
<a href="#exit-tunnel-section" class="nav-item" data-section="exit">
<div class="nav-icon">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="10"/>
<path d="M16 12l-4-4-4 4M12 16V8"/>
</svg>
</div>
<span class="nav-label">Outro</span>
</a>
</div>
</nav>
<!-- Starfield Background -->
<div id="space"></div>
<!-- Tunnel Background -->
<div class="image-container">
<div class="tunnel">
<img src="Materialien/Raumschiff.png" alt="Tunnel">
</div>
</div>
<!-- Content -->
<div class="wrapper">
<div class="content">
<section class="section hero" id="hero-section">
<h1 class="title">
<span class="small">Discover our</span>
<span class="big">SOLAR<br>SYSTEM</span>
<span class="small">A View through</span>
</h1>
</section>
<section class="section carousel-section" id="carousel-section">
<!-- 3D Carousel -->
<div id="drag-container">
<div id="spin-container"></div>
<div id="ground"></div>
</div>
<div id="music-container"></div>
</section>
<!-- Asteroid Section - Smooth Entry from Right -->
<section class="section asteroid-section" id="asteroid-section">
</section>

</div>
</div>

<!-- Exit Tunnel Section - Outside wrapper, starts after all content -->
<section class="section exit-tunnel-section" id="exit-tunnel-section">
  <div class="exit-content">
    <h1 class="exit-title">
      <span class="exit-small">Thanks for</span>
      <span class="exit-big">EXPLORING</span>
      <span class="exit-small">See you soon</span>
    </h1>
  </div>
</section>

<!-- Scroll Indicator -->
<div class="scroll-indicator" id="scroll-indicator">
<div class="scroll-arrow">↓</div>
</div>
<!-- Planet Detail Modal -->
<div id="planet-detail-modal">
<button class="close-button" id="close-modal-btn" aria-label="Close"></button>
<div class="modal-content">
<div class="modal-left">
<div class="modal-small-title">Discover the</div>
<h1 class="modal-planet-title" id="modal-planet-name">PLANET<br>EARTH</h1>
<p class="modal-planet-description" id="modal-planet-description">
        The Earth is the only known planet with life.
</p>
</div>
<div class="modal-right">
<canvas class="modal-planet-canvas" id="modal-planet-canvas" width="600" height="600"></canvas>
</div>
</div>
</div>
<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
<!-- DEIN CODE -->
<script src="main.js"></script>
</body>
</html>
